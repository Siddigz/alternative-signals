[project]
name = "review-pulse"
version = "0.1.0"
description = "Backtest: does the tone of Amazon reviews predict company results and stock returns?"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "requests>=2.32",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "yfinance>=0.2.50",
    "plotly>=5.24",
    "transformers>=4.46",
    "torch>=2.5",
    "pytrends>=4.9.2",
]

[project.scripts]
review-pulse = "review_pulse.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_pulse"]

# GPU build of PyTorch (CUDA 12.6). Delete these two tables to use the CPU build.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
